# Gateway + Postgres 16 + the Node coder (examples/node_coder).
# Required in the environment (no defaults on purpose):
#   POSTGRES_PASSWORD   database password
# Run from the repository root:
#   docker compose -f examples/docker/compose.yaml up --build
services:
  gateway:
    build:
      context: ../..
      args:
        EXTRAS: postgres,mcp
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      A2AGW_BASE_URL: ${A2AGW_BASE_URL:-http://localhost:8000}
      A2AGW_DB_URL: postgresql+asyncpg://a2agw:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}@postgres:5432/a2agw
    command: ["serve", "-c", "/config/a2agw.compose.yaml", "--host", "0.0.0.0", "--port", "8000"]
    volumes:
      - ./:/config:ro
      - gateway-data:/data
    read_only: true
    tmpfs:
      - /tmp
    depends_on:
      postgres:
        condition: service_healthy
      coder:
        condition: service_started

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: a2agw
      POSTGRES_DB: a2agw
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U a2agw -d a2agw"]
      interval: 5s
      timeout: 3s
      retries: 10

  coder:
    image: node:24-alpine
    working_dir: /app
    command: ["node", "agent.mjs"]
    volumes:
      - ../node_coder:/app:ro
    environment:
      PORT: "9000"

volumes:
  gateway-data:
  pgdata:
