notes: |
  A service-to-service call in the other direction (inventory to orders). The whole-system
  test wires a dedicated pair: orders-api first, pointed at a pre-picked inventory port, then
  inventory-service on that port with the webhook URL of that orders-api. Authenticating the
  webhook is out of scope here.
