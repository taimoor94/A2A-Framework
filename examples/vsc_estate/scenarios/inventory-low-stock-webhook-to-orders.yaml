id: inventory-low-stock-webhook-to-orders
request: |
  Purchasing finds out a product is running low only when customers start getting "insufficient
  stock" errors. Have inventory-service tell orders-api when stock runs low. Inventory gets two
  settings, LOW_STOCK_WEBHOOK_URL and LOW_STOCK_THRESHOLD (default 3): when a reservation takes a
  product's stock from above the threshold to at or below it, inventory POSTs {"sku", "stock",
  "threshold"} to the webhook URL, once per crossing, best effort, without slowing down or failing
  the reservation. orders-api receives it at POST /webhooks/low-stock (202 when recorded, 400 for
  a malformed payload), stores the alert, and lists alerts oldest first at GET
  /alerts/low-stock as {"alerts": [{"sku", "stock", "threshold", "received_at"}]}. Document the
  webhook in inventory.yaml (OpenAPI webhooks) and both endpoints in orders.yaml.
systems: [orders-api, inventory-service, contract]
acceptance:
  - id: inventory-low-stock-webhook
    system: inventory-service
    files:
      test/low_stock_webhook.test.mjs: |
        // The low-stock webhook, configured as documented: LOW_STOCK_WEBHOOK_URL and
        // LOW_STOCK_THRESHOLD on the server process.
        import assert from "node:assert/strict";
        import { spawn } from "node:child_process";
        import { once } from "node:events";
        import { createServer } from "node:http";
        import { after, before, test } from "node:test";
        import { fileURLToPath } from "node:url";

        const SERVER = fileURLToPath(new URL("../server.mjs", import.meta.url));
        const received = [];
        let receiver;
        let child;
        let base;

        before(async () => {
          receiver = createServer((req, res) => {
            let body = "";
            req.on("data", (c) => (body += c));
            req.on("end", () => {
              received.push({ path: req.url, body: JSON.parse(body) });
              res.writeHead(202).end();
            });
          });
          receiver.listen(0, "127.0.0.1");
          await once(receiver, "listening");
          const hook = `http://127.0.0.1:${receiver.address().port}/webhooks/low-stock`;
          child = spawn(process.execPath, [SERVER], {
            env: { ...process.env, PORT: "0", LOW_STOCK_WEBHOOK_URL: hook, LOW_STOCK_THRESHOLD: "2" },
            stdio: ["ignore", "pipe", "inherit"],
          });
          const [line] = await once(child.stdout, "data", { signal: AbortSignal.timeout(5000) });
          base = `http://127.0.0.1:${JSON.parse(line.toString()).listening}`;
          await add("LOW-1", 5);
          await add("FLAT-2", 1);
        });

        after(async () => {
          child.kill();
          await new Promise((resolve) => receiver.close(resolve));
        });

        async function add(sku, stock) {
          const res = await fetch(`${base}/products`, {
            method: "POST",
            headers: { "content-type": "application/json" },
            body: JSON.stringify({ sku, name: sku, stock, price_cents: 1 }),
          });
          assert.equal(res.status, 201);
        }

        async function reserve(sku, qty) {
          const res = await fetch(`${base}/products/${sku}/reserve`, {
            method: "POST",
            headers: { "content-type": "application/json" },
            body: JSON.stringify({ qty }),
          });
          return res.status;
        }

        async function eventually(check, ms = 2000) {
          const deadline = Date.now() + ms;
          while (!check()) {
            if (Date.now() > deadline) return false;
            await new Promise((r) => setTimeout(r, 20));
          }
          return true;
        }

        const alertsFor = (sku) => received.filter((r) => r.body.sku === sku);

        test("crossing the threshold sends one webhook", async () => {
          assert.equal(await reserve("LOW-1", 2), 200); // 5 -> 3: above the threshold
          assert.equal(await reserve("LOW-1", 2), 200); // 3 -> 1: crosses it
          assert.ok(await eventually(() => alertsFor("LOW-1").length === 1), "no webhook received");
          assert.deepEqual(alertsFor("LOW-1")[0], {
            path: "/webhooks/low-stock",
            body: { sku: "LOW-1", stock: 1, threshold: 2 },
          });
        });

        test("staying below the threshold does not send it again", async () => {
          assert.equal(await reserve("LOW-1", 1), 200); // 1 -> 0
          await new Promise((r) => setTimeout(r, 200));
          assert.equal(alertsFor("LOW-1").length, 1);
        });

        test("a product that starts below the threshold is not reported by reserving", async () => {
          assert.equal(await reserve("FLAT-2", 1), 200); // 1 -> 0, never was above 2
          await new Promise((r) => setTimeout(r, 200));
          assert.equal(alertsFor("FLAT-2").length, 0);
        });
  - id: orders-low-stock-alerts
    system: orders-api
    files:
      tests/test_low_stock_alerts.py: |
        """orders-api receives inventory's low-stock webhook and lists the alerts."""

        import pytest


        def test_alerts_start_empty(client):
            assert client.get("/alerts/low-stock").json() == {"alerts": []}


        def test_a_webhook_is_recorded(client):
            res = client.post("/webhooks/low-stock", json={"sku": "GADGET-2", "stock": 1, "threshold": 3})
            assert res.status_code == 202
            client.post("/webhooks/low-stock", json={"sku": "WIDGET-1", "stock": 0, "threshold": 3})
            alerts = client.get("/alerts/low-stock").json()["alerts"]
            assert [(a["sku"], a["stock"], a["threshold"]) for a in alerts] == [
                ("GADGET-2", 1, 3),
                ("WIDGET-1", 0, 3),
            ]
            assert all(a["received_at"] for a in alerts)


        @pytest.mark.parametrize(
            "body",
            [
                {},
                {"sku": "A", "stock": -1, "threshold": 3},
                {"sku": "A", "stock": 1},
                {"sku": "", "stock": 1, "threshold": 1},
                {"sku": "A", "stock": True, "threshold": 1},
            ],
        )
        def test_a_bad_payload_is_400(client, body):
            assert client.post("/webhooks/low-stock", json=body).status_code == 400
            assert client.get("/alerts/low-stock").json()["alerts"] == []
  - id: estate-low-stock-webhook
    system: null
    check: estate
    files:
      contract/tests/test_low_stock_webhook_e2e.py: |
        """End to end: an order that takes stock to the threshold makes inventory-service call
        orders-api's webhook, and orders-api lists the alert."""

        import time

        import httpx
        import pytest
        from estate import conforms, free_port, new_product, start_inventory, start_orders


        @pytest.fixture(scope="module")
        def wired(tmp_path_factory):
            tmp = tmp_path_factory.mktemp("webhook")
            inventory_port = free_port()
            orders = start_orders(tmp, f"http://127.0.0.1:{inventory_port}")
            try:
                inventory = start_inventory(
                    tmp,
                    port=inventory_port,
                    env={
                        "LOW_STOCK_WEBHOOK_URL": orders.url + "/webhooks/low-stock",
                        "LOW_STOCK_THRESHOLD": "2",
                    },
                )
            except BaseException:
                orders.stop()
                raise
            try:
                with (
                    httpx.Client(base_url=orders.url, timeout=10) as o,
                    httpx.Client(base_url=inventory.url, timeout=10) as i,
                ):
                    yield o, i
            finally:
                inventory.stop()
                orders.stop()


        def alerts(orders, api):
            res = orders.get("/alerts/low-stock")
            assert res.status_code == 200, "orders-api has no /alerts/low-stock"
            return conforms(api, "GET", "/alerts/low-stock", res)["alerts"]


        def test_an_order_reaching_the_threshold_raises_an_alert(wired, orders_api):
            orders, inventory = wired
            sku = new_product(inventory, stock=5)
            assert orders.post("/orders", json={"lines": [{"sku": sku, "qty": 2}]}).status_code == 201
            assert [a for a in alerts(orders, orders_api) if a["sku"] == sku] == []
            assert orders.post("/orders", json={"lines": [{"sku": sku, "qty": 2}]}).status_code == 201
            deadline = time.monotonic() + 5
            while not (found := [a for a in alerts(orders, orders_api) if a["sku"] == sku]):
                assert time.monotonic() < deadline, "no low-stock alert reached orders-api"
                time.sleep(0.05)
            assert [(a["stock"], a["threshold"]) for a in found] == [(1, 2)]


        def test_the_webhook_receiver_conforms(wired, orders_api):
            orders, _ = wired
            res = orders.post("/webhooks/low-stock", json={"sku": "X-1", "stock": 0, "threshold": 2})
            conforms(orders_api, "POST", "/webhooks/low-stock", res)
            bad = orders.post("/webhooks/low-stock", json={"sku": "X-1"})
            assert bad.status_code == 400
            conforms(orders_api, "POST", "/webhooks/low-stock", bad)


        def test_the_webhook_is_documented(inventory_api):
            hook = inventory_api["webhooks"]["lowStock"]["post"]
            schema = hook["requestBody"]["content"]["application/json"]["schema"]
            assert set(schema["required"]) == {"sku", "stock", "threshold"}
