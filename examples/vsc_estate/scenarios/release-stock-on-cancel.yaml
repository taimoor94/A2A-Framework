id: release-stock-on-cancel
request: |
  Cancelling an order does not give its stock back. The order is marked cancelled in
  orders-api but the units it reserved stay reserved in inventory-service, so after a few
  cancellations the shop shows products as sold out that are sitting in the warehouse.
  When an order is cancelled, release the stock of every line in inventory. A second cancel
  must not release anything again (it is already refused with 409). If inventory cannot
  release the stock, answer 502 and leave the order placed rather than cancelling it with
  its stock lost. Update the orders contract with the new behaviour and the 502.
systems: [orders-api, inventory-service, contract]
acceptance:
  - id: orders-cancel-releases
    system: orders-api
    files:
      tests/test_cancel_releases_stock.py: |
        """Cancelling an order gives its stock back to inventory, exactly once."""


        def place(client, *lines):
            res = client.post("/orders", json={"lines": [{"sku": s, "qty": q} for s, q in lines]})
            assert res.status_code == 201, res.text
            return res.json()


        def test_cancel_releases_every_line(client, inventory):
            order = place(client, ("WIDGET-1", 3), ("GADGET-2", 2))
            assert (inventory.stock("WIDGET-1"), inventory.stock("GADGET-2")) == (17, 3)
            res = client.post(f"/orders/{order['id']}/cancel")
            assert res.status_code == 200
            assert res.json()["status"] == "cancelled"
            assert (inventory.stock("WIDGET-1"), inventory.stock("GADGET-2")) == (20, 5)
            assert sorted(inventory.calls("release")) == [
                ("GADGET-2", {"qty": 2}),
                ("WIDGET-1", {"qty": 3}),
            ]


        def test_cancelling_twice_releases_once(client, inventory):
            order = place(client, ("WIDGET-1", 4))
            assert client.post(f"/orders/{order['id']}/cancel").status_code == 200
            assert client.post(f"/orders/{order['id']}/cancel").status_code == 409
            assert inventory.stock("WIDGET-1") == 20
            assert len(inventory.calls("release")) == 1


        def test_other_orders_keep_their_stock(client, inventory):
            keep = place(client, ("WIDGET-1", 5))
            drop = place(client, ("WIDGET-1", 1))
            client.post(f"/orders/{drop['id']}/cancel")
            assert inventory.stock("WIDGET-1") == 15
            assert client.get(f"/orders/{keep['id']}").json()["status"] == "placed"
  - id: estate-cancel-releases
    system: null
    check: estate
    files:
      contract/tests/test_cancel_releases_stock_e2e.py: |
        """End to end: a cancelled order's stock is back in inventory-service."""

        from estate import conforms, new_product, stock


        def test_cancel_puts_the_stock_back(orders, inventory, orders_api):
            a = new_product(inventory, stock=8)
            b = new_product(inventory, stock=3)
            res = orders.post("/orders", json={"lines": [{"sku": a, "qty": 5}, {"sku": b, "qty": 3}]})
            assert res.status_code == 201, res.text
            assert (stock(inventory, a), stock(inventory, b)) == (3, 0)
            cancelled = orders.post(f"/orders/{res.json()['id']}/cancel")
            assert conforms(orders_api, "POST", "/orders/{order_id}/cancel", cancelled)["status"] == (
                "cancelled"
            )
            assert (stock(inventory, a), stock(inventory, b)) == (8, 3)


        def test_released_stock_can_be_ordered_again(orders, inventory):
            sku = new_product(inventory, stock=2)
            first = orders.post("/orders", json={"lines": [{"sku": sku, "qty": 2}]}).json()
            assert orders.post("/orders", json={"lines": [{"sku": sku, "qty": 1}]}).status_code == 409
            orders.post(f"/orders/{first['id']}/cancel")
            assert orders.post("/orders", json={"lines": [{"sku": sku, "qty": 2}]}).status_code == 201
