id: order-total-with-tax-from-inventory-price
request: |
  Finance needs order totals. Today an order only lists SKUs and quantities, and the
  checkout computes money on the client from whatever price it last saw. When an order is
  placed, orders-api should take each product's current price_cents from inventory-service
  (GET /products/{sku}) and keep it with the order line as unit_price_cents, so later price
  changes do not alter existing orders. Every order then reports subtotal_cents (sum of qty
  x unit price), tax_cents and total_cents. Tax is a flat rate configured on orders-api with
  TAX_RATE_BPS in basis points, default 2000 (20%), applied to the subtotal and rounded half
  up to a whole cent. Existing order databases must keep working. Document the new fields in
  the orders contract.
systems: [orders-api, inventory-service, contract]
acceptance:
  - id: orders-totals
    system: orders-api
    files:
      tests/test_order_totals.py: |
        """Orders carry prices from inventory and a subtotal, tax (20% by default) and total."""


        def place(client, *lines):
            res = client.post("/orders", json={"lines": [{"sku": s, "qty": q} for s, q in lines]})
            assert res.status_code == 201, res.text
            return res.json()


        def test_totals_use_inventory_prices(client):
            order = place(client, ("WIDGET-1", 3), ("GADGET-2", 1))
            assert [line["unit_price_cents"] for line in order["lines"]] == [1250, 4999]
            assert order["subtotal_cents"] == 3 * 1250 + 4999
            assert order["tax_cents"] == 1750  # 20% of 8749 = 1749.8, rounded half up
            assert order["total_cents"] == 8749 + 1750


        def test_tax_rounds_half_up_to_a_cent(client, inventory):
            inventory.add("HALF-1", stock=5, price_cents=1)  # 20% of 5 cents = 1 cent exactly
            inventory.add("ODD-2", stock=5, price_cents=333)  # 20% of 333 = 66.6 -> 67
            inventory.add("DOWN-3", stock=5, price_cents=7)  # 20% of 7 = 1.4 -> 1
            assert place(client, ("HALF-1", 5))["tax_cents"] == 1
            assert place(client, ("ODD-2", 1))["tax_cents"] == 67
            assert place(client, ("DOWN-3", 1))["tax_cents"] == 1


        def test_the_price_is_fixed_when_the_order_is_placed(client, inventory):
            order = place(client, ("WIDGET-1", 2))
            inventory.products["WIDGET-1"]["price_cents"] = 9999  # a later price change
            again = client.get(f"/orders/{order['id']}").json()
            assert again["lines"][0]["unit_price_cents"] == 1250
            assert again["total_cents"] == order["total_cents"] == 3000
            assert client.get("/orders").json()["orders"][0]["total_cents"] == 3000


        def test_unknown_products_are_still_422(client):
            res = client.post("/orders", json={"lines": [{"sku": "NOPE-1", "qty": 1}]})
            assert res.status_code == 422
  - id: estate-totals
    system: null
    check: estate
    files:
      contract/tests/test_order_totals_e2e.py: |
        """End to end: order totals come from the inventory catalogue price, and the tax rate is the
        orders-api TAX_RATE_BPS setting."""

        import httpx
        import pytest
        from estate import conforms, new_product, start_orders


        def test_totals_from_the_catalogue(orders, inventory, orders_api):
            a = new_product(inventory, stock=10, price_cents=1999)
            b = new_product(inventory, stock=10, price_cents=500)
            res = orders.post("/orders", json={"lines": [{"sku": a, "qty": 2}, {"sku": b, "qty": 3}]})
            assert res.status_code == 201, res.text
            order = conforms(orders_api, "POST", "/orders", res)
            assert [line["unit_price_cents"] for line in order["lines"]] == [1999, 500]
            assert order["subtotal_cents"] == 5498
            assert order["tax_cents"] == 1100  # 20% of 5498 = 1099.6
            assert order["total_cents"] == 6598
            conforms(orders_api, "GET", "/orders/{order_id}", orders.get(f"/orders/{order['id']}"))


        @pytest.fixture
        def orders_at_ten_percent(services):
            svc = start_orders(services.tmp, services.inventory.url, env={"TAX_RATE_BPS": "1000"})
            try:
                with httpx.Client(base_url=svc.url, timeout=10.0) as c:
                    yield c
            finally:
                svc.stop()


        def test_the_tax_rate_is_configurable(orders_at_ten_percent, inventory):
            sku = new_product(inventory, stock=3, price_cents=1234)
            res = orders_at_ten_percent.post("/orders", json={"lines": [{"sku": sku, "qty": 1}]})
            assert res.status_code == 201, res.text
            body = res.json()
            assert (body["subtotal_cents"], body["tax_cents"], body["total_cents"]) == (1234, 123, 1357)
