id: rename-qty-to-quantity
request: |
  The field name "qty" keeps confusing partners integrating with us, and the API style guide
  says no abbreviations. Rename it to "quantity" everywhere in the public contract: order
  lines in orders-api requests and responses, and the stock change body of inventory-service
  /reserve and /release (orders-api must send the new name when it calls inventory). This is
  a coordinated breaking change, contract version 1.1.0: both services must refuse a body
  that still sends "qty" with a 400 whose error message mentions "quantity", rather than
  silently ignoring it. Update both OpenAPI documents and every test that uses the old name.
  The database column does not need renaming.
systems: [orders-api, inventory-service, contract]
acceptance:
  - id: inventory-quantity
    system: inventory-service
    files:
      test/quantity.test.mjs: |
        import assert from "node:assert/strict";
        import { test } from "node:test";

        import { call, useServer } from "./helpers.mjs";

        const ctx = useServer([{ sku: "Q-1", name: "Q", stock: 10, price_cents: 1 }]);

        test("reserve and release take quantity", async () => {
          const r = await call(ctx, "POST", "/products/Q-1/reserve", { quantity: 3 });
          assert.equal(r.status, 200);
          assert.equal(r.body.stock, 7);
          const back = await call(ctx, "POST", "/products/Q-1/release", { quantity: 3 });
          assert.equal(back.status, 200);
          assert.equal(back.body.stock, 10);
        });

        test("the old qty field is refused with a clear message", async () => {
          const r = await call(ctx, "POST", "/products/Q-1/reserve", { qty: 3 });
          assert.equal(r.status, 400);
          assert.match(r.body.error, /quantity/);
          assert.equal((await call(ctx, "GET", "/products/Q-1")).body.stock, 10);
        });

        test("quantity must be a positive integer", async () => {
          for (const quantity of [0, -2, 2.5, "3"]) {
            const r = await call(ctx, "POST", "/products/Q-1/release", { quantity });
            assert.equal(r.status, 400);
          }
        });
  - id: orders-quantity
    system: orders-api
    files:
      tests/test_quantity_field.py: |
        """Order lines carry "quantity" (contract 1.1), in requests, responses and calls to inventory."""

        import json

        import httpx
        import pytest
        from app import create_app
        from starlette.testclient import TestClient


        class QuantityInventory:
            """An inventory that speaks contract 1.1 only: it refuses the old "qty" field."""

            def __init__(self):
                self.stock = {"WIDGET-1": 20}
                self.bodies = []

            def handle(self, request):
                sku, action = request.url.path.strip("/").split("/")[1:3]
                body = json.loads(request.content)
                self.bodies.append(body)
                if "quantity" not in body or "qty" in body:
                    return httpx.Response(400, json={"error": "quantity must be a positive integer"})
                if action == "reserve":
                    self.stock[sku] -= body["quantity"]
                return httpx.Response(200, json={"sku": sku, "stock": self.stock[sku]})


        @pytest.fixture
        def setup(tmp_path):
            fake = QuantityInventory()
            app = create_app(
                str(tmp_path / "q.db"), "http://inv", transport=httpx.MockTransport(fake.handle)
            )
            with TestClient(app) as c:
                yield c, fake


        def test_orders_take_and_return_quantity(setup):
            client, fake = setup
            res = client.post("/orders", json={"lines": [{"sku": "WIDGET-1", "quantity": 4}]})
            assert res.status_code == 201, res.text
            order = res.json()
            assert order["lines"] == [{"sku": "WIDGET-1", "quantity": 4}]
            assert client.get(f"/orders/{order['id']}").json()["lines"] == order["lines"]
            assert client.get("/orders").json()["orders"][0]["lines"] == order["lines"]
            assert fake.bodies == [{"quantity": 4}]
            assert fake.stock["WIDGET-1"] == 16


        def test_the_old_field_is_refused(setup):
            client, fake = setup
            res = client.post("/orders", json={"lines": [{"sku": "WIDGET-1", "qty": 4}]})
            assert res.status_code == 400
            assert "quantity" in res.json()["error"]
            assert fake.bodies == []
  - id: estate-quantity
    system: null
    check: estate
    files:
      contract/tests/test_quantity_field_e2e.py: |
        """End to end on contract 1.1: "quantity" everywhere, "qty" refused by both services."""

        from estate import conforms, new_product, stock


        def test_order_lines_use_quantity(orders, inventory, orders_api):
            sku = new_product(inventory, stock=6)
            res = orders.post("/orders", json={"lines": [{"sku": sku, "quantity": 2}]})
            assert res.status_code == 201, res.text
            order = conforms(orders_api, "POST", "/orders", res)
            assert order["lines"] == [{"sku": sku, "quantity": 2}]
            assert stock(inventory, sku) == 4


        def test_inventory_stock_changes_use_quantity(inventory, inventory_api):
            sku = new_product(inventory, stock=6)
            res = inventory.post(f"/products/{sku}/reserve", json={"quantity": 5})
            assert conforms(inventory_api, "POST", "/products/{sku}/reserve", res)["stock"] == 1


        def test_qty_is_refused_by_both(orders, inventory, orders_api, inventory_api):
            sku = new_product(inventory, stock=6)
            res = orders.post("/orders", json={"lines": [{"sku": sku, "qty": 2}]})
            assert res.status_code == 400
            conforms(orders_api, "POST", "/orders", res)
            direct = inventory.post(f"/products/{sku}/reserve", json={"qty": 2})
            assert direct.status_code == 400
            conforms(inventory_api, "POST", "/products/{sku}/reserve", direct)
            assert stock(inventory, sku) == 6


        def test_the_documents_describe_quantity(orders_api, inventory_api):
            line = orders_api["components"]["schemas"]["OrderLine"]
            assert "quantity" in line["required"] and "qty" not in line["properties"]
            change = inventory_api["components"]["schemas"]["StockChange"]
            assert "quantity" in change["required"] and "qty" not in change["properties"]
