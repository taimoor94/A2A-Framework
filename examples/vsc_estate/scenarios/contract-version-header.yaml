id: contract-version-header
request: |
  We are about to start contract 2 work and need to be able to tell which contract a
  caller and a service speak before anything breaks in production. Introduce an
  X-Contract-Version header with the major version of the contract, currently "1". Both
  orders-api and inventory-service must put X-Contract-Version: 1 on every response,
  including errors and unknown routes. Requests may send the header; a request asking for
  any other version must be refused with 400 and the error "unsupported contract version"
  before it does anything, while requests without the header keep working. orders-api must
  send X-Contract-Version: 1 on every call it makes to inventory-service. Document the
  header in both OpenAPI documents (a components/headers/ContractVersion entry whose schema
  enumerates the supported version).
systems: [orders-api, inventory-service, contract]
acceptance:
  - id: inventory-contract-version
    system: inventory-service
    files:
      test/contract_version.test.mjs: |
        import assert from "node:assert/strict";
        import { test } from "node:test";

        import { call, useServer } from "./helpers.mjs";

        const ctx = useServer([{ sku: "V-1", name: "V", stock: 1, price_cents: 1 }]);

        test("every response carries X-Contract-Version: 1", async () => {
          const responses = [
            await call(ctx, "GET", "/healthz"),
            await call(ctx, "GET", "/products"),
            await call(ctx, "GET", "/products/V-1"),
            await call(ctx, "GET", "/products/NOPE"), // 404
            await call(ctx, "POST", "/products/V-1/reserve", { qty: 5 }), // 409
            await call(ctx, "GET", "/no/such/route"),
          ];
          for (const res of responses) assert.equal(res.headers.get("x-contract-version"), "1");
        });

        test("a request for the current version is served", async () => {
          const res = await call(ctx, "GET", "/products/V-1", undefined, { "X-Contract-Version": "1" });
          assert.equal(res.status, 200);
        });

        test("a request for another version is refused with 400", async () => {
          for (const version of ["2", "0", "1.1", "latest"]) {
            const res = await call(ctx, "POST", "/products/V-1/reserve", { qty: 1 }, {
              "X-Contract-Version": version,
            });
            assert.equal(res.status, 400, version);
            assert.equal(res.body.error, "unsupported contract version");
            assert.equal(res.headers.get("x-contract-version"), "1");
          }
          assert.equal((await call(ctx, "GET", "/products/V-1")).body.stock, 1);
        });
  - id: orders-contract-version
    system: orders-api
    files:
      tests/test_contract_version.py: |
        """orders-api speaks contract version 1 out loud: X-Contract-Version on every response and
        on every call to inventory, and other versions are refused."""

        import pytest


        def test_every_response_carries_the_version(client):
            responses = [
                client.get("/healthz"),
                client.get("/orders"),
                client.post("/orders", json={"lines": [{"sku": "WIDGET-1", "qty": 1}]}),
                client.get("/orders/999"),
                client.post("/orders", json={}),
                client.get("/no/such/route"),
            ]
            for res in responses:
                assert res.headers.get("x-contract-version") == "1", res.request.url


        def test_calls_to_inventory_send_the_version(client, inventory):
            assert (
                client.post("/orders", json={"lines": [{"sku": "WIDGET-1", "qty": 2}]}).status_code == 201
            )
            assert inventory.requests, "orders-api did not call inventory"
            for req in inventory.requests:
                assert req.headers.get("x-contract-version") == "1"


        def test_the_current_version_is_served(client):
            res = client.get("/orders", headers={"X-Contract-Version": "1"})
            assert res.status_code == 200


        @pytest.mark.parametrize("version", ["2", "0", "v1", "1.1"])
        def test_another_version_is_refused(client, inventory, version):
            res = client.post(
                "/orders",
                json={"lines": [{"sku": "WIDGET-1", "qty": 1}]},
                headers={"X-Contract-Version": version},
            )
            assert res.status_code == 400
            assert res.json()["error"] == "unsupported contract version"
            assert res.headers.get("x-contract-version") == "1"
            assert inventory.stock("WIDGET-1") == 20
  - id: estate-contract-version
    system: null
    check: estate
    files:
      contract/tests/test_contract_version_e2e.py: |
        """End to end: both services announce contract version 1 and refuse any other."""

        import pytest
        from estate import conforms, new_product, stock


        def test_both_services_announce_the_version(orders, inventory):
            sku = new_product(inventory, stock=3)
            responses = [
                orders.get("/healthz"),
                orders.post("/orders", json={"lines": [{"sku": sku, "qty": 1}]}),
                orders.get("/orders/999999"),
                inventory.get("/healthz"),
                inventory.get(f"/products/{sku}"),
                inventory.post(f"/products/{sku}/reserve", json={"qty": 99}),
            ]
            for res in responses:
                assert res.headers.get("x-contract-version") == "1", res.request.url


        @pytest.mark.parametrize("service", ["orders", "inventory"])
        def test_another_version_is_refused(service, orders, inventory):
            client = orders if service == "orders" else inventory
            res = client.get("/healthz", headers={"X-Contract-Version": "2"})
            assert res.status_code == 400
            assert res.json()["error"] == "unsupported contract version"


        def test_an_order_flows_with_the_header(orders, inventory, orders_api):
            sku = new_product(inventory, stock=3)
            res = orders.post(
                "/orders",
                json={"lines": [{"sku": sku, "qty": 2}]},
                headers={"X-Contract-Version": "1"},
            )
            assert res.status_code == 201, res.text
            conforms(orders_api, "POST", "/orders", res)
            assert stock(inventory, sku) == 1


        def test_the_header_is_documented(orders_api, inventory_api):
            for api in (orders_api, inventory_api):
                assert api["components"]["headers"]["ContractVersion"]["schema"]["enum"] == ["1"]
