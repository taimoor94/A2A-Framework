  +class ContractVersion:
  +    """ASGI middleware: stamp X-Contract-Version on every response, refuse other versions."""
  +
  +    def __init__(self, app: ASGIApp) -> None:
  +        self.app = app
  +
  +    async def __call__(self, scope: Scope, receive: Receive, send: Send) -> None:
  +        if scope["type"] != "http":
  +            await self.app(scope, receive, send)
  +            return
  +        asked = [v for k, v in scope["headers"] if k == b"x-contract-version"]
  +
  +        async def stamped(message: Message) -> None:
  +            if message["type"] == "http.response.start":
  +                headers = [h for h in message.get("headers", []) if h[0] != b"x-contract-version"]
