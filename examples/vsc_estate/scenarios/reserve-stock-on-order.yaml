id: reserve-stock-on-order
request: |
  Orders with several lines are leaking stock. When one line of an order cannot be reserved
  (out of stock, or a SKU inventory does not know), orders-api rejects the order, but the
  lines it already reserved before that one stay reserved in inventory-service forever, so
  the stock is gone and nobody bought it. Placing an order must reserve stock for every line
  or for none: if any line is refused, give back whatever was reserved for that order before
  answering. A successful order keeps its reservations. Document the all-or-nothing rule in
  the orders contract.
systems: [orders-api, inventory-service, contract]
acceptance:
  - id: orders-all-or-nothing
    system: orders-api
    files:
      tests/test_reserve_all_or_nothing.py: |
        """Placing an order reserves stock for every line or for none."""


        def place(client, *lines):
            return client.post("/orders", json={"lines": [{"sku": s, "qty": q} for s, q in lines]})


        def test_a_refused_line_releases_the_lines_before_it(client, inventory):
            res = place(client, ("WIDGET-1", 2), ("GADGET-2", 1), ("GIZMO-3", 1))
            assert res.status_code == 409
            assert res.json()["sku"] == "GIZMO-3"
            assert inventory.stock("WIDGET-1") == 20
            assert inventory.stock("GADGET-2") == 5
            assert client.get("/orders").json()["orders"] == []


        def test_an_unknown_product_releases_the_lines_before_it(client, inventory):
            res = place(client, ("WIDGET-1", 3), ("NOPE-9", 1))
            assert res.status_code == 422
            assert inventory.stock("WIDGET-1") == 20
            released = inventory.calls("release")
            assert released == [("WIDGET-1", {"qty": 3})]


        def test_a_placed_order_keeps_its_reservations(client, inventory):
            res = place(client, ("WIDGET-1", 2), ("GADGET-2", 5))
            assert res.status_code == 201
            assert inventory.stock("WIDGET-1") == 18
            assert inventory.stock("GADGET-2") == 0
            assert inventory.calls("release") == []
  - id: estate-all-or-nothing
    system: null
    check: estate
    files:
      contract/tests/test_reserve_all_or_nothing_e2e.py: |
        """End to end: a multi-line order that inventory refuses leaves no stock reserved."""

        from estate import conforms, new_product, stock


        def test_refused_multi_line_order_reserves_nothing(orders, inventory, orders_api):
            plenty = new_product(inventory, stock=10)
            scarce = new_product(inventory, stock=1)
            lines = [{"sku": plenty, "qty": 4}, {"sku": scarce, "qty": 2}]
            res = orders.post("/orders", json={"lines": lines})
            assert res.status_code == 409
            assert conforms(orders_api, "POST", "/orders", res)["sku"] == scarce
            assert stock(inventory, plenty) == 10
            assert stock(inventory, scarce) == 1


        def test_unknown_sku_in_the_middle_reserves_nothing(orders, inventory):
            first = new_product(inventory, stock=5)
            last = new_product(inventory, stock=5)
            lines = [{"sku": first, "qty": 1}, {"sku": "NO-SUCH-SKU", "qty": 1}, {"sku": last, "qty": 1}]
            res = orders.post("/orders", json={"lines": lines})
            assert res.status_code == 422
            assert (stock(inventory, first), stock(inventory, last)) == (5, 5)
