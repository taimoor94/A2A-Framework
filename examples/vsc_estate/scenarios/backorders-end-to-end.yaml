id: backorders-end-to-end
request: |
  Sales wants to keep taking orders for products that are temporarily out of stock instead
  of turning customers away. Add backorders end to end. A client opts in per order with
  "allow_backorder": true on POST /orders. Inventory then reserves whatever stock there is
  and records the shortfall on the product as a "backordered" count (POST
  /products/{sku}/reserve takes the same allow_backorder flag and answers with how many
  units were reserved and how many backordered). The order is accepted with status
  "backordered" when any line is short, and each order line shows its "backordered" units
  (0 when fully in stock). Without the flag nothing changes: short stock is still a 409.
  The flag must be a boolean. Existing order databases must keep working. Update both
  OpenAPI documents in the contract repository so the new fields are documented.
systems: [orders-api, inventory-service, contract]
acceptance:
  - id: inventory-backorders
    system: inventory-service
    files:
      test/backorders.test.mjs: |
        import assert from "node:assert/strict";
        import { test } from "node:test";

        import { call, useServer } from "./helpers.mjs";

        const ctx = useServer([
          { sku: "LOW-1", name: "Low", stock: 2, price_cents: 100 },
          { sku: "NONE-2", name: "None", stock: 0, price_cents: 100 },
          { sku: "OK-3", name: "Ok", stock: 10, price_cents: 100 },
        ]);

        test("a backorder reserves what is there and backorders the rest", async () => {
          const r = await call(ctx, "POST", "/products/LOW-1/reserve", { qty: 5, allow_backorder: true });
          assert.equal(r.status, 200);
          assert.deepEqual(r.body, { sku: "LOW-1", stock: 0, reserved: 2, backordered: 3 });
          const p = await call(ctx, "GET", "/products/LOW-1");
          assert.equal(p.body.stock, 0);
          assert.equal(p.body.backordered, 3);
        });

        test("backorders accumulate on an empty product", async () => {
          await call(ctx, "POST", "/products/NONE-2/reserve", { qty: 1, allow_backorder: true });
          const r = await call(ctx, "POST", "/products/NONE-2/reserve", { qty: 4, allow_backorder: true });
          assert.deepEqual(r.body, { sku: "NONE-2", stock: 0, reserved: 0, backordered: 4 });
          assert.equal((await call(ctx, "GET", "/products/NONE-2")).body.backordered, 5);
        });

        test("without allow_backorder a short reservation is still refused", async () => {
          const r = await call(ctx, "POST", "/products/OK-3/reserve", { qty: 11 });
          assert.equal(r.status, 409);
          assert.equal((await call(ctx, "GET", "/products/OK-3")).body.backordered, 0);
        });

        test("a reservation that fits backorders nothing", async () => {
          const r = await call(ctx, "POST", "/products/OK-3/reserve", { qty: 3, allow_backorder: true });
          assert.deepEqual(r.body, { sku: "OK-3", stock: 7, reserved: 3, backordered: 0 });
        });

        test("allow_backorder must be a boolean", async () => {
          const r = await call(ctx, "POST", "/products/OK-3/reserve", { qty: 1, allow_backorder: "yes" });
          assert.equal(r.status, 400);
        });
  - id: orders-backorders
    system: orders-api
    files:
      tests/test_backorders.py: |
        """Orders with allow_backorder accept lines that are short of stock."""

        import json

        import httpx
        import pytest
        from app import create_app
        from conftest import FakeInventory
        from starlette.testclient import TestClient


        class BackorderingInventory(FakeInventory):
            """The fake inventory plus the documented allow_backorder behaviour of /reserve."""

            def handle(self, request):
                parts = request.url.path.strip("/").split("/")
                body = json.loads(request.content or b"{}")
                if parts[-1] == "reserve" and body.get("allow_backorder") is True:
                    self.requests.append(request)
                    product = self.products[parts[1]]
                    reserved = min(product["stock"], body["qty"])
                    product["stock"] -= reserved
                    short = body["qty"] - reserved
                    return httpx.Response(
                        200,
                        json={
                            "sku": parts[1],
                            "stock": product["stock"],
                            "reserved": reserved,
                            "backordered": short,
                        },
                    )
                return super().handle(request)


        @pytest.fixture
        def backordering(tmp_path):
            fake = BackorderingInventory()
            fake.add("LOW-1", stock=2)
            fake.add("OK-2", stock=10)
            app = create_app(
                str(tmp_path / "b.db"), "http://inv", transport=httpx.MockTransport(fake.handle)
            )
            with TestClient(app) as c:
                yield c, fake


        def test_a_short_line_is_backordered(backordering):
            client, fake = backordering
            res = client.post(
                "/orders",
                json={
                    "lines": [{"sku": "LOW-1", "qty": 5}, {"sku": "OK-2", "qty": 1}],
                    "allow_backorder": True,
                },
            )
            assert res.status_code == 201, res.text
            order = res.json()
            assert order["status"] == "backordered"
            assert order["lines"] == [
                {"sku": "LOW-1", "qty": 5, "backordered": 3},
                {"sku": "OK-2", "qty": 1, "backordered": 0},
            ]
            assert client.get(f"/orders/{order['id']}").json() == order
            sent = [b for _, b in fake.calls("reserve")]
            assert all(b.get("allow_backorder") is True for b in sent)


        def test_an_order_that_fits_is_placed(backordering):
            client, _ = backordering
            res = client.post(
                "/orders", json={"lines": [{"sku": "OK-2", "qty": 2}], "allow_backorder": True}
            )
            assert res.json()["status"] == "placed"
            assert res.json()["lines"][0]["backordered"] == 0


        def test_without_the_flag_short_stock_is_still_409(backordering):
            client, fake = backordering
            res = client.post("/orders", json={"lines": [{"sku": "LOW-1", "qty": 5}]})
            assert res.status_code == 409
            assert all("allow_backorder" not in b for _, b in fake.calls("reserve"))


        def test_the_flag_must_be_a_boolean(backordering):
            client, _ = backordering
            body = {"lines": [{"sku": "OK-2", "qty": 1}], "allow_backorder": "yes"}
            assert client.post("/orders", json=body).status_code == 400
  - id: estate-backorders
    system: null
    check: estate
    files:
      contract/tests/test_backorders_e2e.py: |
        """End to end: an order with allow_backorder is accepted and the shortfall is visible in both
        services, every response conforming to the contract."""

        from estate import conforms, new_product


        def test_backorder_end_to_end(orders, inventory, orders_api, inventory_api):
            sku = new_product(inventory, stock=2)
            res = orders.post("/orders", json={"lines": [{"sku": sku, "qty": 5}], "allow_backorder": True})
            assert res.status_code == 201, res.text
            order = conforms(orders_api, "POST", "/orders", res)
            assert order["status"] == "backordered"
            assert order["lines"] == [{"sku": sku, "qty": 5, "backordered": 3}]
            product = conforms(inventory_api, "GET", "/products/{sku}", inventory.get(f"/products/{sku}"))
            assert (product["stock"], product["backordered"]) == (0, 3)
            listed = conforms(orders_api, "GET", "/orders", orders.get("/orders"))
            assert order in listed["orders"]


        def test_inventory_reservation_conforms(inventory, inventory_api):
            sku = new_product(inventory, stock=1)
            res = inventory.post(f"/products/{sku}/reserve", json={"qty": 4, "allow_backorder": True})
            body = conforms(inventory_api, "POST", "/products/{sku}/reserve", res)
            assert body == {"sku": sku, "stock": 0, "reserved": 1, "backordered": 3}


        def test_short_stock_without_backorder_is_still_refused(orders, inventory):
            sku = new_product(inventory, stock=1)
            assert orders.post("/orders", json={"lines": [{"sku": sku, "qty": 2}]}).status_code == 409
