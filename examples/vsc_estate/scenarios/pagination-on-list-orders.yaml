id: pagination-on-list-orders
request: |
  GET /orders returns every order ever placed in one response. It is now several megabytes,
  times out on the admin dashboard and will only get worse. Paginate it: GET /orders takes
  an optional limit (1 to 200, default 50) and returns {"orders": [...], "next_cursor": ...}
  with orders still oldest first. next_cursor is an opaque string to pass back as ?cursor=
  for the next page, and null on the last page. Paging must be stable while new orders come
  in: following the cursors visits every order exactly once, and orders placed meanwhile
  show up on a later page. A bad limit or a cursor we did not issue is a 400. Document the
  parameters and the response in the orders contract, and keep the contract tests working
  when there are more orders than fit on one page.
systems: [orders-api, contract]
acceptance:
  - id: orders-pagination
    system: orders-api
    files:
      tests/test_list_pagination.py: |
        """GET /orders returns pages: ?limit= (1..200, default 50) and an opaque next_cursor."""

        import pytest


        def place(client, n):
            ids = []
            for _ in range(n):
                res = client.post("/orders", json={"lines": [{"sku": "WIDGET-1", "qty": 1}]})
                assert res.status_code == 201
                ids.append(res.json()["id"])
            return ids


        def ids(page):
            return [o["id"] for o in page["orders"]]


        @pytest.fixture
        def stocked(inventory):
            inventory.products["WIDGET-1"]["stock"] = 10_000
            return inventory


        def test_following_next_cursor_visits_every_order_once(client, stocked):
            placed = place(client, 5)
            first = client.get("/orders", params={"limit": 2}).json()
            assert ids(first) == placed[:2]
            assert isinstance(first["next_cursor"], str) and first["next_cursor"]
            second = client.get("/orders", params={"limit": 2, "cursor": first["next_cursor"]}).json()
            assert ids(second) == placed[2:4]
            third = client.get("/orders", params={"limit": 2, "cursor": second["next_cursor"]}).json()
            assert ids(third) == placed[4:]
            assert third["next_cursor"] is None


        def test_the_default_page_is_50(client, stocked):
            placed = place(client, 53)
            first = client.get("/orders").json()
            assert ids(first) == placed[:50]
            rest = client.get("/orders", params={"cursor": first["next_cursor"]}).json()
            assert ids(rest) == placed[50:]
            assert rest["next_cursor"] is None


        def test_an_exact_last_page_has_no_cursor(client, stocked):
            place(client, 2)
            page = client.get("/orders", params={"limit": 2}).json()
            assert len(page["orders"]) == 2 and page["next_cursor"] is None


        def test_orders_placed_while_paging_show_up_later(client, stocked):
            placed = place(client, 3)
            first = client.get("/orders", params={"limit": 2}).json()
            placed += place(client, 2)
            nxt = client.get("/orders", params={"limit": 10, "cursor": first["next_cursor"]}).json()
            assert ids(nxt) == placed[2:]


        def test_an_empty_list(client):
            assert client.get("/orders").json() == {"orders": [], "next_cursor": None}


        @pytest.mark.parametrize(
            "params",
            [{"limit": "0"}, {"limit": "201"}, {"limit": "ten"}, {"limit": "-1"}, {"cursor": "x!"}],
        )
        def test_bad_paging_parameters_are_400(client, params):
            assert client.get("/orders", params=params).status_code == 400


        def test_200_is_allowed(client, stocked):
            place(client, 3)
            assert len(client.get("/orders", params={"limit": 200}).json()["orders"]) == 3
