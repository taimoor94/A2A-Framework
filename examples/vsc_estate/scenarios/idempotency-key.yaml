  +    @asynccontextmanager
  +    async def key_lock(key: str) -> Any:
  +        """Serialise requests that share an idempotency key; forget the lock when idle."""
  +        lock, users = key_locks.get(key, (asyncio.Lock(), 0))
  +        key_locks[key] = (lock, users + 1)
