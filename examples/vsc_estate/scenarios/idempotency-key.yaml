id: idempotency-key
request: |
  The checkout front end retries POST /orders when the network times out, and every retry
  places a second order and reserves the stock again; support has refunded a dozen duplicate
  orders this week. Support an Idempotency-Key request header on POST /orders: a retry with
  the same key and the same order must return the order created the first time (still 201,
  with an Idempotent-Replayed: true header) without reserving anything again, even after a
  restart of orders-api. Reusing a key for a different order is a client bug, answer 422. A
  key from a refused order (for example out of stock) can be used again. Keys are 1 to 255
  printable characters. Without the header nothing changes. Document the header in the
  orders contract.
systems: [orders-api, contract]
acceptance:
  - id: orders-idempotency-key
    system: orders-api
    files:
      tests/test_idempotency_key.py: |
        """POST /orders with an Idempotency-Key header is safe to retry."""

        import httpx
        from app import create_app
        from starlette.testclient import TestClient

        ORDER = {"lines": [{"sku": "WIDGET-1", "qty": 2}]}


        def post(client, body, key=None):
            headers = {} if key is None else {"Idempotency-Key": key}
            return client.post("/orders", json=body, headers=headers)


        def test_a_retry_returns_the_same_order_and_reserves_once(client, inventory):
            first = post(client, ORDER, "checkout-7f3a")
            assert first.status_code == 201
            retry = post(client, ORDER, "checkout-7f3a")
            assert retry.status_code == 201
            assert retry.json() == first.json()
            assert retry.headers.get("Idempotent-Replayed") == "true"
            assert "Idempotent-Replayed" not in first.headers
            assert inventory.stock("WIDGET-1") == 18
            assert len(inventory.calls("reserve")) == 1
            assert len(client.get("/orders").json()["orders"]) == 1


        def test_the_same_key_for_a_different_order_is_refused(client, inventory):
            assert post(client, ORDER, "k-1").status_code == 201
            other = post(client, {"lines": [{"sku": "WIDGET-1", "qty": 3}]}, "k-1")
            assert other.status_code == 422
            assert "Idempotency-Key" in other.json()["error"]
            assert inventory.stock("WIDGET-1") == 18


        def test_different_keys_and_no_key_place_separate_orders(client, inventory):
            assert post(client, ORDER, "a").json()["id"] != post(client, ORDER, "b").json()["id"]
            assert post(client, ORDER).json()["id"] != post(client, ORDER).json()["id"]
            assert inventory.stock("WIDGET-1") == 12


        def test_a_refused_order_does_not_use_up_the_key(client, inventory):
            big = {"lines": [{"sku": "GADGET-2", "qty": 6}]}
            assert post(client, big, "retry-me").status_code == 409
            inventory.products["GADGET-2"]["stock"] = 10  # restocked
            res = post(client, big, "retry-me")
            assert res.status_code == 201
            assert "Idempotent-Replayed" not in res.headers


        def test_keys_survive_a_restart(tmp_path, inventory):
            db = str(tmp_path / "restart.db")

            def app():
                return create_app(
                    db, "http://inventory.test", transport=httpx.MockTransport(inventory.handle)
                )

            with TestClient(app()) as c:
                first = post(c, ORDER, "persisted").json()
            with TestClient(app()) as c:
                assert post(c, ORDER, "persisted").json()["id"] == first["id"]
            assert inventory.stock("WIDGET-1") == 18


        def test_a_bad_key_is_400(client):
            assert post(client, ORDER, "x" * 256).status_code == 400
            assert post(client, ORDER, "").status_code == 400
