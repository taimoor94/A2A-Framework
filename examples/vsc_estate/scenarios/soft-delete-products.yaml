id: soft-delete-products
request: |
  Deleting a product in inventory-service erases it, and then order history breaks:
  support cannot look up what a discontinued SKU was, and orders-api reports it as an
  "unknown product" as if it never existed. Make DELETE /products/{sku} a soft delete. A
  deleted product stays readable at GET /products/{sku} with "deleted": true (products that
  are still sold show "deleted": false), disappears from GET /products unless the caller
  asks for ?include_deleted=true, cannot be reserved any more (410, error "product
  discontinued"), but still accepts released stock from cancelled orders. Deleting twice is
  fine; a deleted SKU cannot be re-created. orders-api must refuse an order for a deleted
  product with 422 and the error "product discontinued". Update both OpenAPI documents.
systems: [orders-api, inventory-service, contract]
acceptance:
  - id: inventory-soft-delete
    system: inventory-service
    files:
      test/soft_delete.test.mjs: |
        import assert from "node:assert/strict";
        import { test } from "node:test";

        import { call, useServer } from "./helpers.mjs";

        const ctx = useServer([
          { sku: "OLD-1", name: "Old", stock: 4, price_cents: 100 },
          { sku: "NEW-2", name: "New", stock: 4, price_cents: 100 },
        ]);

        test("a deleted product stays readable and is marked deleted", async () => {
          assert.equal((await call(ctx, "DELETE", "/products/OLD-1")).status, 204);
          const res = await call(ctx, "GET", "/products/OLD-1");
          assert.equal(res.status, 200);
          assert.equal(res.body.deleted, true);
          assert.equal(res.body.stock, 4);
          assert.equal((await call(ctx, "GET", "/products/NEW-2")).body.deleted, false);
        });

        test("listing hides deleted products unless include_deleted=true", async () => {
          const listed = await call(ctx, "GET", "/products");
          assert.deepEqual(listed.body.products.map((p) => p.sku), ["NEW-2"]);
          const all = await call(ctx, "GET", "/products?include_deleted=true");
          assert.deepEqual(all.body.products.map((p) => p.sku).sort(), ["NEW-2", "OLD-1"]);
        });

        test("a deleted product cannot be reserved but stock can be released to it", async () => {
          const r = await call(ctx, "POST", "/products/OLD-1/reserve", { qty: 1 });
          assert.equal(r.status, 410);
          assert.equal(r.body.error, "product discontinued");
          const back = await call(ctx, "POST", "/products/OLD-1/release", { qty: 2 });
          assert.equal(back.status, 200);
          assert.equal(back.body.stock, 6);
        });

        test("deleting twice is harmless and a deleted sku cannot be re-created", async () => {
          assert.equal((await call(ctx, "DELETE", "/products/OLD-1")).status, 204);
          const again = await call(ctx, "POST", "/products", {
            sku: "OLD-1",
            name: "Old again",
            stock: 1,
            price_cents: 1,
          });
          assert.equal(again.status, 409);
          assert.equal((await call(ctx, "DELETE", "/products/NEVER-9")).status, 404);
        });
  - id: orders-discontinued
    system: orders-api
    files:
      tests/test_discontinued_products.py: |
        """A product that inventory has deleted (410 on reserve) cannot be ordered: 422."""

        import httpx
        from app import create_app
        from conftest import FakeInventory
        from starlette.testclient import TestClient


        class DiscontinuingInventory(FakeInventory):
            discontinued = frozenset({"OLD-1"})

            def handle(self, request):
                parts = request.url.path.strip("/").split("/")
                if len(parts) == 3 and parts[1] in self.discontinued and parts[2] == "reserve":
                    self.requests.append(request)
                    return httpx.Response(410, json={"error": "product discontinued", "sku": parts[1]})
                return super().handle(request)


        def test_a_discontinued_product_is_422(tmp_path):
            fake = DiscontinuingInventory()
            fake.add("OLD-1", stock=5)
            fake.add("NEW-2", stock=5)
            app = create_app(
                str(tmp_path / "d.db"), "http://inv", transport=httpx.MockTransport(fake.handle)
            )
            with TestClient(app) as client:
                res = client.post("/orders", json={"lines": [{"sku": "OLD-1", "qty": 1}]})
                assert res.status_code == 422
                assert res.json() == {"error": "product discontinued", "sku": "OLD-1"}
                assert client.get("/orders").json()["orders"] == []
                ok = client.post("/orders", json={"lines": [{"sku": "NEW-2", "qty": 1}]})
                assert ok.status_code == 201
  - id: estate-soft-delete
    system: null
    check: estate
    files:
      contract/tests/test_soft_delete_e2e.py: |
        """End to end: a product deleted in inventory is no longer sold, but its history is kept."""

        from estate import conforms, new_product, stock


        def test_a_deleted_product_cannot_be_ordered(orders, inventory, orders_api, inventory_api):
            sku = new_product(inventory, stock=5)
            first = orders.post("/orders", json={"lines": [{"sku": sku, "qty": 2}]})
            assert first.status_code == 201
            assert inventory.delete(f"/products/{sku}").status_code == 204
            res = orders.post("/orders", json={"lines": [{"sku": sku, "qty": 1}]})
            assert res.status_code == 422
            assert conforms(orders_api, "POST", "/orders", res)["error"] == "product discontinued"
            product = conforms(inventory_api, "GET", "/products/{sku}", inventory.get(f"/products/{sku}"))
            assert product["deleted"] is True
            assert stock(inventory, sku) == 3
            old = orders.get(f"/orders/{first.json()['id']}")
            assert old.status_code == 200 and old.json()["lines"][0]["sku"] == sku


        def test_listing_and_reserve_conform(inventory, inventory_api):
            sku = new_product(inventory, stock=1)
            inventory.delete(f"/products/{sku}")
            listed = conforms(inventory_api, "GET", "/products", inventory.get("/products"))
            assert sku not in [p["sku"] for p in listed["products"]]
            everything = inventory.get("/products", params={"include_deleted": "true"})
            assert sku in [
                p["sku"] for p in conforms(inventory_api, "GET", "/products", everything)["products"]
            ]
            gone = inventory.post(f"/products/{sku}/reserve", json={"qty": 1})
            assert gone.status_code == 410
            conforms(inventory_api, "POST", "/products/{sku}/reserve", gone)
