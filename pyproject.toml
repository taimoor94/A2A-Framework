[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "a2a-gateway"
version = "0.1.0"
description = "Framework-agnostic A2A (Agent2Agent protocol) gateway: serve agents inbound and expose partner agents outbound as tools."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.11"
dependencies = [
    "a2a-sdk[http-server,sqlite,telemetry]>=1.2.3,<2",
    "starlette",
    "uvicorn",
    "httpx>=0.28,<0.29",
    "httpcore>=1.0,<2",
    "pydantic>=2",
    "pyjwt[crypto]",
    "pyyaml",
    "typer",
    "opentelemetry-sdk",
]

[project.optional-dependencies]
langchain = ["langchain-core>=1.7"]
langgraph = ["langgraph>=1.2", "langchain-core>=1.7"]
postgres = ["asyncpg>=0.30"]
mcp = ["mcp>=2.3,<3"]
openai = ["openai-agents>=0.24"]
claude = ["claude-agent-sdk>=0.2.174"]
adk = ["google-adk>=2.13"]
ag2 = ["ag2>=1.2"]
llamaindex = ["llama-index-core>=0.14.25"]
# Not in ``all`` and not in the dev group: crewai pins ``mcp<2`` and ``openai<3`` (see
# [tool.uv] conflicts below and the README); its tests run in their own environment
# (scripts/test-crewai.sh).
crewai = ["crewai>=1.15"]
all = [
    "langchain-core>=1.7",
    "langgraph>=1.2",
    "asyncpg>=0.30",
    "mcp>=2.3,<3",
    "openai-agents>=0.24",
    "claude-agent-sdk>=0.2.174",
    "ag2>=1.2",
    "llama-index-core>=0.14.25",
]

[project.scripts]
a2agw = "a2agw.cli:app"

[dependency-groups]
dev = [
    "pytest",
    "pytest-asyncio",
    "respx",
    "ruff",
    "mypy",
    "langgraph-checkpoint-sqlite>=3.1.2",
    "asyncpg>=0.32.0",
    "mcp>=2.3,<3",
    "langchain-core>=1.7",
    "langgraph>=1.2",
    "openai-agents>=0.24",
    "claude-agent-sdk>=0.2.174",
    "google-adk>=2.13",
    "ag2>=1.2",
    "llama-index-core>=0.14.25",
]
crewai-test = ["pytest", "pytest-asyncio", "crewai>=1.15"]

[tool.uv]
# crewai pins mcp<2 and openai<3, which the mcp/openai extras (and so all, and the dev group)
# cannot satisfy; current crewai also needs opentelemetry-api>=1.45.1, above google-adk's
# <=1.44 cap. uv resolves the crewai extra and the crewai-test group on their own.
conflicts = [
    [{ extra = "crewai" }, { extra = "mcp" }],
    [{ extra = "crewai" }, { extra = "openai" }],
    [{ extra = "crewai" }, { extra = "all" }],
    [{ extra = "crewai" }, { extra = "adk" }],
    [{ extra = "crewai" }, { group = "dev" }],
    [{ group = "crewai-test" }, { group = "dev" }],
    [{ group = "crewai-test" }, { extra = "mcp" }],
    [{ group = "crewai-test" }, { extra = "openai" }],
    [{ group = "crewai-test" }, { extra = "all" }],
    [{ group = "crewai-test" }, { extra = "adk" }],
]

[tool.hatch.build.targets.wheel]
packages = ["src/a2agw"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
addopts = "--import-mode=importlib"
testpaths = ["tests"]
pythonpath = ["tests", "."]  # shared helpers (streaming_asgi) and examples/
markers = [
    "postgres: needs a throwaway PostgreSQL 16 (tests/postgres_support.py); skipped without one",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.mypy]
python_version = "3.11"
warn_unused_ignores = true
ignore_missing_imports = true  # protobuf / yaml stubs
files = ["src/a2agw/core", "src/a2agw/context"]
